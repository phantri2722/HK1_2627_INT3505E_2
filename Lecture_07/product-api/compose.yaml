services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: product-api

    ports:
      - "5000:8000"

    volumes:
      - product_data:/app/instance

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  product_data: