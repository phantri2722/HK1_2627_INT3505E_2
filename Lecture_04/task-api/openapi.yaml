openapi: 3.0.3

info:
  title: Tasks API
  version: 1.0.0
  description: API quản lý task nội bộ

servers:
  - url: /v1
    description: Local development

tags:
  - name: tasks

paths:
  /tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      summary: Lấy danh sách task

      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/StatusFilter'

      responses:
        '200':
          description: Danh sách task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'

    post:
      tags: [tasks]
      operationId: createTask
      summary: Tạo task mới

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskInput'

      responses:
        '201':
          description: Task được tạo thành công
          headers:
            Location:
              schema:
                type: string

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'

        '422':
          $ref: '#/components/responses/ValidationError'


  /tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'

    get:
      tags: [tasks]
      operationId: getTaskById
      summary: Lấy một task

      responses:
        '200':
          description: Task được tìm thấy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'

        '404':
          $ref: '#/components/responses/NotFound'


    patch:
      tags: [tasks]
      operationId: patchTask
      summary: Cập nhật một phần task

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskInput'

      responses:
        '200':
          description: Task được cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'

        '404':
          $ref: '#/components/responses/NotFound'

        '422':
          $ref: '#/components/responses/ValidationError'


    delete:
      tags: [tasks]
      operationId: deleteTask
      summary: Xóa task

      responses:
        '204':
          description: Task đã được xóa

        '404':
          $ref: '#/components/responses/NotFound'


components:

  parameters:

    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    StatusFilter:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [open, done]


  schemas:

    Task:
      type: object
      required:
        - id
        - title
        - status
        - priority

      properties:

        id:
          type: string
          format: uuid
          readOnly: true

        title:
          type: string
          minLength: 1
          example: Hoàn thành bài OpenAPI

        status:
          type: string
          enum: [open, done]
          example: open

        priority:
          type: string
          enum: [low, normal, high]
          example: high

        dueDate:
          type: string
          format: date
          nullable: true
          example: '2026-10-20'

        assigneeId:
          type: string
          format: uuid
          nullable: true


    CreateTaskInput:
      type: object
      required:
        - title

      properties:

        title:
          type: string
          minLength: 1

        status:
          type: string
          enum: [open, done]
          default: open

        priority:
          type: string
          enum: [low, normal, high]
          default: normal

        dueDate:
          type: string
          format: date
          nullable: true

        assigneeId:
          type: string
          format: uuid
          nullable: true


    UpdateTaskInput:
      type: object

      properties:

        title:
          type: string
          minLength: 1

        status:
          type: string
          enum: [open, done]

        priority:
          type: string
          enum: [low, normal, high]

        dueDate:
          type: string
          format: date
          nullable: true

        assigneeId:
          type: string
          format: uuid
          nullable: true


    TaskPage:
      type: object
      required:
        - data
        - total

      properties:

        data:
          type: array
          items:
            $ref: '#/components/schemas/Task'

        total:
          type: integer
          minimum: 0


    Problem:
      type: object
      required:
        - title
        - status

      properties:

        type:
          type: string

        title:
          type: string

        status:
          type: integer

        detail:
          type: string

        instance:
          type: string


  responses:

    NotFound:
      description: Không tìm thấy task

      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    ValidationError:
      description: Dữ liệu không hợp lệ

      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'